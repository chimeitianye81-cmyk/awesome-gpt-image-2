name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/YouMind-OpenLab/awesome-gpt-image-2.git

      - name: Fetch & merge upstream
        run: |
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit

      - name: Push to origin
        run: |
          git push origin main
